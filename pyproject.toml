[project]
name = "mcp-devops-server"
version = "0.2.0"
description = "MCP server for DevOps operations"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Praveendhra Rajkumar"}]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
